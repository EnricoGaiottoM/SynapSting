[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsting"
version = "0.1.0"
description = "SynapSting: gêmeo digital do cérebro de Drosophila para prever efeitos do imidacloprido"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.25", "scipy>=1.10", "pandas>=2.0", "pyarrow>=14", "matplotlib>=3.7", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=7"]
validacao = ["brian2>=2.5"]
perbot = ["opencv-python>=4.8", "pyserial>=3.5"]
docs = ["reportlab>=4.0", "pypdf>=4.0"]

[tool.setuptools]
packages = ["synapsting"]

[tool.setuptools.package-data]
synapsting = ["neuron_ids.json"]

[tool.pytest.ini_options]
testpaths = ["testes"]
